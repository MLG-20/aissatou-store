# Durée HTTPS d'un jour tant que le domaine n'est pas définitif : à allonger à la mise en ligne.
# GPS gardé pour le site : il sert à placer l'adresse exacte sur la carte.
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
# Observation seulement : à activer après un vrai paiement PayTech sur le domaine définitif.
# Alpine et Filament ont besoin de unsafe-eval, le site contient du code dans les pages.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src 'self' data: https://fonts.bunny.net; img-src 'self' data: blob: https://tile.openstreetmap.org https://i.ytimg.com https://ui-avatars.com; media-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self' https://paytech.sn" always;
